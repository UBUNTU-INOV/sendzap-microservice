version: '3.8'

services:
  whatsapp-api:
    build: .
    ports:
      - "3000:3000"
    mem_limit: 4g
    mem_reservation: 2g
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_KEY=${API_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MAX_WA_CONNECTIONS=${MAX_WA_CONNECTIONS:-120}
      - MAX_WEBHOOK_QUEUE=${MAX_WEBHOOK_QUEUE:-15000}
    volumes:
      - sessions_data:/app/sessions
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "caddy_0.reverse_proxy={{upstreams 3000}}"

volumes:
  sessions_data:
